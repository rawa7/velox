name: velox
description: "Velox Shipping - Fast and reliable shipping services."
publish_to: 'none'

version: 1.1.0+13


environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI and Icons
  cupertino_icons: ^1.0.8
  
  # Networking
  http: ^1.2.1
  
  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  
  # Localization
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  
  # External links
  url_launcher: ^6.2.5
  
  qr_flutter: ^4.1.0
  
  # WebView
  webview_flutter: ^4.7.0
  
  # Image handling
  image_picker: ^1.0.7
  
  # HTML parsing
  html: ^0.15.4
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  
  # Device info
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Enable generation of localization files
  generate: true

  assets:
    - assets/

  fonts:
    - family: DroidKufiBold
      fonts:
        - asset: assets/Droid.Arabic.Kufi_.Bold_DownloadSoftware.iR_.ttf
    - family: CanvaSans
      fonts:
        - asset: assets/CanvaSans-Regular.otf
    - family: DroidKufi
      fonts:
        - asset: assets/Droid.Arabic.Kufi_DownloadSoftware.iR_.ttf
